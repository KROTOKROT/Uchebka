server:
  port: 8080
spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: uchebka-api
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
yandex:
  base-url: ${YANDEX_BASE_URL:https://ai.api.cloud.yandex.net/v1}
  api-key: ${YANDEX_API_KEY:}
  project-id: ${YANDEX_PROJECT_ID:b1gfj3v8keh3qobuh6rv}
  prompt-id: ${YANDEX_PROMPT_ID:fvt27hjfedvl5f9qs3lk}
  timeout: 45s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
resilience4j:
  retry:
    instances:
      yandex:
        max-attempts: 2
        wait-duration: 1s
  circuitbreaker:
    instances:
      yandex:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
